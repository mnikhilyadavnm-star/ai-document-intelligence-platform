services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_docs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    # Placeholder service: the backend is a FastAPI starter skeleton.
    # Add a Dockerfile under backend/ before running this service end to end.
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_docs
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    # Placeholder service: the frontend is a React starter placeholder.
    # Add a Dockerfile / package.json under frontend/ before running this service end to end.
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
